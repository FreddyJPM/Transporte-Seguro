<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Seguro Ilo | Gestión Municipal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; background-color: #f8fafc; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; filter: invert(0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- COMPONENTE ICONO ---
        const Icon = ({ name, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    iconRef.current.innerHTML = '';
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    iconElement.className = className;
                    iconRef.current.appendChild(iconElement);
                    window.lucide.createIcons();
                }
            }, [name, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        function App() {
            // --- SESIÓN Y NAVEGACIÓN ---
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [activeTab, setActiveTab] = useState('buscar');
            const [notification, setNotification] = useState(null);

            // --- DATOS PRINCIPALES ---
            const [unidades, setUnidades] = useState([
                { id: '1', placa: 'V7X-882', dni: '45678912', conductor: 'Juan Quispe Mamani', marca: 'Toyota', modelo: 'Hiace', anio: '2022', tipo: 'Regular', ruta: 'Ilo - Pampa Inalámbrica', finAutorizacion: '2026-12-31', empresa: 'Empresa El Algarrobal S.A.' }
            ]);

            const [usuarios, setUsuarios] = useState([
                { id: 'u1', nombre: 'Admin General', user: 'admin', pass: '123', rol: 'Administrador' },
                { id: 'u2', nombre: 'Registrador 1', user: 'reg1', pass: '123', rol: 'Registrador' },
                { id: 'u3', nombre: 'Inspector Campo', user: 'ins1', pass: '123', rol: 'Inspector' }
            ]);

            const [searchTerm, setSearchTerm] = useState('');
            const [selectedUnidad, setSelectedUnidad] = useState(null);
            const [formTipo, setFormTipo] = useState('Taxi');

            // --- NOTIFICACIONES ---
            const notify = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 4000);
            };

            // --- LÓGICA DE CARGA MASIVA (EXCEL) ---
            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

                        // Mapeo según el orden: Placa, DNI, Conductor, Marca, Modelo, Año, Tipo, Ruta, Vencimiento, Empresa
                        const nuevasUnidades = data.slice(1).map((fila, index) => ({
                            id: `xlsx-${Date.now()}-${index}`,
                            placa: String(fila[0] || '').toUpperCase().trim(),
                            dni: String(fila[1] || '').trim(),
                            conductor: String(fila[2] || '').trim(),
                            marca: String(fila[3] || '').trim(),
                            modelo: String(fila[4] || '').trim(),
                            anio: String(fila[5] || '').trim(),
                            tipo: String(fila[6] || 'Taxi').trim(),
                            ruta: String(fila[7] || 'N/A').trim(),
                            finAutorizacion: String(fila[8] || '').trim(),
                            empresa: String(fila[9] || '').trim()
                        })).filter(u => u.placa.length > 3);

                        setUnidades(prev => [...nuevasUnidades, ...prev]);
                        notify(`Éxito: Se han importado ${nuevasUnidades.length} unidades al sistema.`);
                        setActiveTab('reportes');
                    } catch (err) {
                        notify("Error: El formato del archivo no es válido.");
                    }
                };
                reader.readAsBinaryString(file);
            };

            // --- LÓGICA DE LOGIN ---
            const handleLogin = (e) => {
                e.preventDefault();
                const u = e.target.user.value;
                const p = e.target.password.value;
                const found = usuarios.find(usr => usr.user === u && usr.pass === p);
                if (found) {
                    setCurrentUser(found);
                    setIsLoggedIn(true);
                    if (found.rol === 'Inspector') setActiveTab('buscar');
                    else if (found.rol === 'Registrador') setActiveTab('registro');
                    else setActiveTab('reportes');
                } else {
                    notify("Credenciales incorrectas.");
                }
            };

            // --- ESTADÍSTICAS ---
            const stats = useMemo(() => {
                const hoy = new Date();
                const total = unidades.length;
                const vencidas = unidades.filter(u => new Date(u.finAutorizacion) < hoy).length;
                return { total, vencidas, aptas: total - vencidas };
            }, [unidades]);

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6">
                        <div className="w-full max-w-md bg-white rounded-[3rem] p-12 shadow-2xl animate-fade-in text-center">
                            <div className="bg-indigo-600 w-20 h-20 rounded-[2rem] flex items-center justify-center text-white mx-auto mb-8 shadow-xl">
                                <Icon name="shield-check" className="w-10 h-10" />
                            </div>
                            <h1 className="text-3xl font-black tracking-tighter uppercase mb-1 text-slate-900">T-Seguro Ilo</h1>
                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-10">Municipalidad Provincial de Ilo</p>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input name="user" required placeholder="Usuario" className="w-full bg-slate-50 p-5 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-indigo-500" />
                                <input name="password" type="password" required placeholder="Contraseña" className="w-full bg-slate-50 p-5 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-indigo-500" />
                                <button className="w-full bg-slate-900 text-white p-6 rounded-[2rem] font-black uppercase text-xs tracking-widest hover:bg-indigo-600 shadow-xl transition-all">Ingresar</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col lg:flex-row">
                    {/* BARRA LATERAL */}
                    <aside className="w-full lg:w-72 bg-slate-900 text-white p-6 flex flex-col gap-6 shadow-2xl z-20">
                        <div className="flex items-center gap-3 px-4 mb-6">
                            <div className="bg-indigo-600 p-2 rounded-xl"><Icon name="shield-check" /></div>
                            <span className="text-xl font-black uppercase tracking-tighter italic">T-Seguro</span>
                        </div>
                        
                        <nav className="flex-1 space-y-1">
                            <NavItem active={activeTab === 'buscar'} onClick={() => setActiveTab('buscar')} icon="search" label="Consulta" />
                            
                            {(currentUser.rol === 'Administrador' || currentUser.rol === 'Registrador') && (
                                <>
                                    <NavItem active={activeTab === 'registro'} onClick={() => setActiveTab('registro')} icon="plus-circle" label="Registro" />
                                    <NavItem active={activeTab === 'masiva'} onClick={() => setActiveTab('masiva')} icon="file-up" label="Carga Masiva" />
                                </>
                            )}

                            {currentUser.rol === 'Administrador' && (
                                <>
                                    <NavItem active={activeTab === 'reportes'} onClick={() => setActiveTab('reportes')} icon="layout-dashboard" label="Dashboard" />
                                    <NavItem active={activeTab === 'usuarios'} onClick={() => setActiveTab('usuarios')} icon="users" label="Accesos" />
                                </>
                            )}
                        </nav>

                        <div className="pt-6 border-t border-slate-800 flex items-center gap-4 px-4">
                            <div className="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center font-bold text-white uppercase">{currentUser.nombre[0]}</div>
                            <div className="flex-1 overflow-hidden">
                                <p className="text-[10px] font-black uppercase truncate">{currentUser.nombre}</p>
                                <p className="text-[9px] text-slate-500 font-bold uppercase">{currentUser.rol}</p>
                            </div>
                            <button onClick={() => setIsLoggedIn(false)} className="text-slate-500 hover:text-red-400"><Icon name="log-out" /></button>
                        </div>
                    </aside>

                    {/* CONTENIDO */}
                    <main className="flex-1 p-6 lg:p-12 overflow-y-auto">
                        <div className="max-w-6xl mx-auto">
                            
                            {/* DASHBOARD */}
                            {activeTab === 'reportes' && (
                                <div className="space-y-10 animate-fade-in">
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                                        <StatCard label="Total Unidades" value={stats.total} icon="truck" color="bg-indigo-600" />
                                        <StatCard label="Unidades Aptas" value={stats.aptas} icon="check-circle" color="bg-emerald-500" />
                                        <StatCard label="Vencidas/Baja" value={stats.vencidas} icon="alert-octagon" color="bg-rose-500" />
                                    </div>

                                    <div className="bg-white rounded-[3rem] shadow-sm border border-slate-100 overflow-hidden">
                                        <div className="p-8 border-b border-slate-50 flex justify-between items-center">
                                            <h3 className="font-black uppercase tracking-tighter">Padrón Municipal Actualizado</h3>
                                            <span className="text-[10px] font-black bg-slate-100 px-4 py-1 rounded-full">{unidades.length} Registros</span>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left">
                                                <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                                    <tr>
                                                        <th className="p-8">Placa</th>
                                                        <th className="p-8">Empresa / Conductor</th>
                                                        <th className="p-8">Tipo / Ruta</th>
                                                        <th className="p-8">Estado</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-50">
                                                    {unidades.map(u => (
                                                        <tr key={u.id} className="hover:bg-slate-50/50 transition-all cursor-pointer" onClick={() => setSelectedUnidad(u)}>
                                                            <td className="p-8 font-black text-xl text-slate-900">{u.placa}</td>
                                                            <td className="p-8">
                                                                <p className="text-xs font-black uppercase text-slate-700 leading-tight">{u.empresa}</p>
                                                                <p className="text-[10px] font-bold text-slate-400 uppercase mt-1">{u.conductor}</p>
                                                            </td>
                                                            <td className="p-8">
                                                                <p className="text-[10px] font-black text-indigo-600 uppercase">{u.tipo}</p>
                                                                <p className="text-[9px] font-bold text-slate-400 truncate max-w-[150px]">{u.ruta}</p>
                                                            </td>
                                                            <td className="p-8">
                                                                <span className={`px-4 py-1 rounded-full text-[9px] font-black uppercase ${new Date(u.finAutorizacion) < new Date() ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-600'}`}>
                                                                    {new Date(u.finAutorizacion) < new Date() ? 'Vencido' : 'Autorizado'}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* BUSCADOR */}
                            {activeTab === 'buscar' && (
                                <div className="text-center py-20 animate-fade-in max-w-2xl mx-auto">
                                    <div className="bg-indigo-600 w-24 h-24 rounded-[2.5rem] flex items-center justify-center text-white mx-auto mb-10 shadow-xl animate-pulse">
                                        <Icon name="search" className="w-10 h-10" />
                                    </div>
                                    <h2 className="text-5xl font-black text-slate-900 tracking-tighter uppercase mb-12 italic leading-none">Consulta de Unidad</h2>
                                    <div className="relative group">
                                        <input 
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value.toUpperCase())}
                                            onKeyPress={(e) => e.key === 'Enter' && (()=>{
                                                const f = unidades.find(u => u.placa === searchTerm || u.dni === searchTerm);
                                                if(f) setSelectedUnidad(f); else notify("No se encontraron registros.");
                                            })()}
                                            placeholder="PLACA O DNI"
                                            className="w-full bg-white p-10 rounded-[3.5rem] text-4xl font-black text-center shadow-2xl outline-none border-8 border-transparent focus:border-indigo-100 transition-all"
                                        />
                                    </div>
                                </div>
                            )}

                            {/* REGISTRO */}
                            {activeTab === 'registro' && (
                                <div className="bg-white p-12 rounded-[3.5rem] shadow-xl animate-fade-in border border-slate-50">
                                    <h2 className="text-3xl font-black text-slate-900 uppercase tracking-tighter mb-10">Nuevo Registro de Unidad</h2>
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const fd = new FormData(e.target);
                                        const n = {
                                            id: Date.now().toString(),
                                            placa: fd.get('placa').toUpperCase(),
                                            dni: fd.get('dni'),
                                            conductor: fd.get('conductor'),
                                            marca: fd.get('marca'),
                                            modelo: fd.get('modelo'),
                                            anio: fd.get('anio'),
                                            tipo: fd.get('tipo'),
                                            ruta: fd.get('ruta') || 'N/A',
                                            finAutorizacion: fd.get('vencimiento'),
                                            empresa: fd.get('empresa')
                                        };
                                        setUnidades([n, ...unidades]);
                                        notify("Unidad guardada exitosamente.");
                                        e.target.reset();
                                        setFormTipo('Taxi');
                                    }} className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                        <Field label="Placa" name="placa" placeholder="V7X-882" required />
                                        <Field label="DNI Conductor" name="dni" placeholder="00000000" required />
                                        <Field label="Nombre Conductor" name="conductor" placeholder="Nombre Completo" required />
                                        <div className="md:col-span-3 h-px bg-slate-100 my-4"></div>
                                        <Field label="Marca" name="marca" placeholder="Ej: Toyota" required />
                                        <Field label="Modelo" name="modelo" placeholder="Ej: Hiace" required />
                                        <Field label="Año Fab." name="anio" type="number" placeholder="2022" required />
                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block ml-2">Tipo de Servicio</label>
                                            <select name="tipo" required className="w-full bg-slate-50 p-5 rounded-2xl font-bold outline-none" onChange={(e) => setFormTipo(e.target.value)}>
                                                <option value="Taxi">Taxi</option>
                                                <option value="Trabajadores">Trabajadores</option>
                                                <option value="Estudiantes">Estudiantes</option>
                                                <option value="Regular">Regular (Ruta)</option>
                                            </select>
                                        </div>
                                        {formTipo === 'Regular' && <Field label="Ruta Especificada" name="ruta" placeholder="Ruta 01..." required />}
                                        <Field label="Vencimiento" name="vencimiento" type="date" required />
                                        <div className="md:col-span-3">
                                            <Field label="Empresa / Asociación" name="empresa" placeholder="Razón Social" required />
                                        </div>
                                        <div className="md:col-span-3 pt-6">
                                            <button className="w-full bg-slate-900 text-white p-6 rounded-[2rem] font-black uppercase text-xs tracking-widest hover:bg-indigo-600 transition-all shadow-xl">Guardar en el Padrón</button>
                                        </div>
                                    </form>
                                </div>
                            )}

                            {/* CARGA MASIVA */}
                            {activeTab === 'masiva' && (
                                <div className="bg-white p-20 rounded-[4rem] text-center space-y-10 animate-fade-in border border-slate-100 shadow-sm">
                                    <div className="bg-amber-50 w-24 h-24 rounded-[2rem] flex items-center justify-center mx-auto text-amber-500"><Icon name="file-up" className="w-10 h-10" /></div>
                                    <div className="space-y-2">
                                        <h2 className="text-3xl font-black text-slate-900 uppercase tracking-tighter">Carga Masiva (Excel)</h2>
                                        <p className="text-slate-400 text-sm font-medium">Orden de columnas: Placa, DNI, Conductor, Marca, Modelo, Año, Tipo, Ruta, Vencimiento, Empresa.</p>
                                    </div>
                                    <div className="relative border-4 border-dashed border-slate-100 rounded-[3.5rem] p-24 hover:border-indigo-200 transition-all cursor-pointer bg-slate-50/30 group">
                                        <input type="file" accept=".xlsx, .xls" onChange={handleExcelUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
                                        <Icon name="upload-cloud" className="w-16 h-16 text-slate-200 group-hover:text-indigo-300 mb-6 mx-auto transition-colors" />
                                        <p className="font-black text-slate-300 uppercase tracking-widest text-[10px] group-hover:text-indigo-400">Seleccionar archivo Excel</p>
                                    </div>
                                </div>
                            )}

                            {/* ACCESOS */}
                            {activeTab === 'usuarios' && (
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-10 animate-fade-in">
                                    <div className="lg:col-span-1 bg-white p-10 rounded-[3rem] border border-slate-50 shadow-sm h-fit">
                                        <h3 className="text-xl font-black uppercase mb-8 tracking-tighter">Crear Usuario</h3>
                                        <form onSubmit={(e) => {
                                            e.preventDefault();
                                            const fd = new FormData(e.target);
                                            setUsuarios([...usuarios, { id: Date.now().toString(), nombre: fd.get('nombre'), user: fd.get('user'), pass: fd.get('pass'), rol: fd.get('rol') }]);
                                            notify("Usuario habilitado correctamente.");
                                            e.target.reset();
                                        }} className="space-y-5">
                                            <Field label="Nombre" name="nombre" required />
                                            <Field label="Usuario" name="user" required />
                                            <Field label="Clave" name="pass" type="password" required />
                                            <select name="rol" className="w-full bg-slate-50 p-5 rounded-2xl font-bold outline-none border-2 border-transparent">
                                                <option value="Administrador">Administrador</option>
                                                <option value="Registrador">Registrador</option>
                                                <option value="Inspector">Inspector</option>
                                            </select>
                                            <button className="w-full bg-indigo-600 text-white p-5 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg">Crear Acceso</button>
                                        </form>
                                    </div>
                                    <div className="lg:col-span-2 space-y-4">
                                        {usuarios.map(u => (
                                            <div key={u.id} className="bg-white p-6 rounded-3xl border border-slate-100 flex items-center justify-between shadow-sm">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center font-bold">{u.nombre[0]}</div>
                                                    <div>
                                                        <p className="font-black text-slate-900 uppercase text-sm">{u.nombre}</p>
                                                        <p className="text-[10px] font-black text-indigo-500 uppercase tracking-widest">{u.rol}</p>
                                                    </div>
                                                </div>
                                                <button onClick={() => {
                                                    if(u.id === currentUser.id) return notify("No puedes eliminarte a ti mismo.");
                                                    setUsuarios(usuarios.filter(usr => usr.id !== u.id));
                                                    notify("Usuario eliminado.");
                                                }} className="p-3 text-slate-200 hover:text-red-500 transition-colors"><Icon name="trash-2" /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* MODAL DETALLE */}
                    {selectedUnidad && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-950/90 backdrop-blur-md animate-fade-in">
                            <div className="bg-white w-full max-w-4xl rounded-[4rem] overflow-hidden shadow-2xl flex flex-col md:flex-row relative">
                                <button onClick={() => setSelectedUnidad(null)} className="absolute top-8 right-8 p-4 bg-slate-50 rounded-full hover:text-red-500 transition-all"><Icon name="x" /></button>
                                <div className="w-full md:w-1/3 bg-slate-50 p-12 flex flex-col items-center justify-center text-center border-r">
                                    <div className="bg-white p-10 rounded-[2.5rem] shadow-xl border-8 border-slate-900 mb-8 w-full font-black text-4xl">{selectedUnidad.placa}</div>
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">{selectedUnidad.marca} {selectedUnidad.modelo}</p>
                                </div>
                                <div className="flex-1 p-16 space-y-8">
                                    <div className="grid grid-cols-2 gap-8 text-sm">
                                        <DetailItem label="Servicio" value={selectedUnidad.tipo} />
                                        <DetailItem label="Ruta" value={selectedUnidad.ruta} />
                                        <DetailItem label="Conductor" value={selectedUnidad.conductor} />
                                        <DetailItem label="DNI" value={selectedUnidad.dni} />
                                        <div className="col-span-2"><DetailItem label="Asociación / Empresa" value={selectedUnidad.empresa} /></div>
                                    </div>
                                    <div className={`p-8 rounded-[2.5rem] flex items-center justify-between shadow-xl ${new Date(selectedUnidad.finAutorizacion) < new Date() ? 'bg-rose-500' : 'bg-emerald-500'} text-white`}>
                                        <div>
                                            <p className="text-[10px] font-black uppercase opacity-60">Situación Actual</p>
                                            <h5 className="text-2xl font-black uppercase tracking-tighter">{new Date(selectedUnidad.finAutorizacion) < new Date() ? 'Vencido' : 'Autorizado'}</h5>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[10px] font-black uppercase opacity-60 tracking-widest">Expira</p>
                                            <p className="text-xl font-bold leading-none">{selectedUnidad.finAutorizacion}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TOAST NOTIFICACIÓN */}
                    {notification && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-10 py-5 rounded-full font-black text-[10px] uppercase tracking-widest shadow-2xl z-[200] animate-fade-in flex items-center gap-3">
                            <Icon name="check-circle" className="text-emerald-400" /> {notification}
                        </div>
                    )}
                </div>
            );
        }

        // --- AUXILIARES ---
        const NavItem = ({ active, onClick, icon, label }) => (
            <button onClick={onClick} className={`w-full flex items-center gap-5 p-5 rounded-2xl transition-all ${active ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/20' : 'text-slate-500 hover:bg-slate-800'}`}>
                <Icon name={icon} />
                <span className="text-[10px] font-black uppercase tracking-widest">{label}</span>
            </button>
        );

        const Field = ({ label, name, placeholder, type = "text", required = false }) => (
            <div className="space-y-3">
                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">{label}</label>
                <input name={name} type={type} required={required} placeholder={placeholder} className="w-full bg-slate-50 p-5 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-indigo-100 transition-all" />
            </div>
        );

        const DetailItem = ({ label, value }) => (
            <div>
                <p className="text-[9px] font-black text-indigo-500 uppercase tracking-widest mb-1">{label}</p>
                <p className="font-black text-slate-900 uppercase leading-none">{value}</p>
            </div>
        );

        const StatCard = ({ label, value, icon, color }) => (
            <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 flex items-center gap-6 hover:shadow-md transition-all">
                <div className={`${color} p-4 rounded-2xl text-white shadow-lg`}><Icon name={icon} className="w-6 h-6" /></div>
                <div>
                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none mb-2">{label}</p>
                    <p className="text-4xl font-black text-slate-900 leading-none">{value}</p>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
